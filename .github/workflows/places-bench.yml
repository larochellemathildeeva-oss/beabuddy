name: places benchmark

# How well place search finds ~20 real places, against the live map services.
# Report only — the table is in the run's summary and log. Runs when search
# changes, or by hand.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/lib/places.functions.ts"
      - "src/lib/poi-search.ts"
      - "src/lib/place-label.ts"
      - "src/lib/geo-endpoints.ts"
      - "scripts/places-bench/**"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/places-bench/run.mjs
        env:
          # Optional: set this repository secret to measure LocationIQ instead
          # of the public OpenStreetMap servers.
          LOCATIONIQ_TOKEN: ${{ secrets.LOCATIONIQ_TOKEN }}
