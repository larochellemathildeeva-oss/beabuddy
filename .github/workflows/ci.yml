name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so a quick follow-up push doesn't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Vite transpiles without typechecking, so a type error ships silently
      # unless this step runs. Blocking on purpose.
      - name: Typecheck
        run: npm run typecheck

      # Blocking, as of the pass that cleared the backlog. Most of it was one
      # generated file (supabase/types.ts, 896 findings), now ignored; the
      # remaining 196 were auto-fixable formatting in hand-written code.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The frozen import checks: every sample plan through the list reader and
  # every frozen Gemini answer through today's clean-up, then a real 127-stop
  # Japan plan placed from frozen map answers and scored against a reviewed
  # answer key. No keys, no calls. Fails when anything reads or pins worse
  # than the saved bar (scripts/itinerary-audit/frozen).
  import-audit:
    name: import audit (frozen)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Frozen import checks
        run: npm run audit:ci
