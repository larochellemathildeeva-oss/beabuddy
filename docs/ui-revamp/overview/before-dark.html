<!doctype html>
<meta charset="utf-8">
<title>Before · Dark</title>
<script>
const parts = ["0.txt","1-0.txt","1-1.txt","1-2a.txt","1-2b.txt","1-3.txt","2-0.txt","2-1.txt","2-2.txt","2-3.txt"];
const base = "https://raw.githubusercontent.com/larochellemathildeeva-oss/beabuddy/cursor/overview-revamp-4acd/docs/ui-revamp/overview/shots/before-dark/";
Promise.all(parts.map((name) => fetch(base + name).then((response) => response.text()))).then((chunks) => {
  document.open();
  document.write(chunks.join(""));
  document.close();
});
</script>
