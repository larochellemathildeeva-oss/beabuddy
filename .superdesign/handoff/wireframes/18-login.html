<!doctype html><html lang="en" data-theme="calm"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Béa · Welcome back</title><style>
:root{--bg:#F7F2E9;--surface:#FFFDF8;--raised:#fff;--text:#28231F;--muted:#746B63;--border:#DDD3C7;--accent:#A9583D;--on:#fff;--green:#58745C;--warn:#B47A35;--danger:#A94A46;--shadow:0 2px 12px #1E1A1730}
[data-theme=colorful]{--bg:#FFF9F3;--surface:#fff;--raised:#fff;--text:#29252A;--muted:#766D76;--border:#E7DDE2;--accent:#B55B45}
[data-theme=dark]{--bg:#171513;--surface:#211E1B;--raised:#2B2723;--text:#F6F0E8;--muted:#B8AEA4;--border:#3A342F;--accent:#D98261;--on:#171513;--shadow:0 2px 12px #0008}
*{box-sizing:border-box}html,body{margin:0;background:#d8d4ce;color:var(--text);font-family:"DejaVu Sans",Arial,sans-serif}
button,input{font:inherit}.phone{width:390px;min-height:844px;margin:24px auto;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 12px 40px #0003}
.screen{min-height:844px;padding:22px 20px 88px}.serif,h1,h2,h3{font-family:"DejaVu Serif",Georgia,serif}h1{font-size:30px;line-height:36px;margin:0}h2{font-size:20px;line-height:26px;margin:0}h3{font-size:17px;line-height:22px;margin:0}.muted{color:var(--muted)}.small{font-size:13px;line-height:18px}.caps{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.stack{display:flex;flex-direction:column;gap:12px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.flat{box-shadow:none}.tile{min-height:92px}.hero{border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#c9b99f,#8d765f);color:#fff;padding:18px;min-height:148px;display:flex;flex-direction:column;justify-content:flex-end;position:relative}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0008,transparent 65%)}.hero>*{position:relative}
.btn{height:52px;border:0;border-radius:16px;padding:0 18px;font-weight:700}.primary{background:var(--accent);color:var(--on)}.secondary{background:var(--surface);border:1px solid var(--border);color:var(--text)}.chip{height:34px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:0 12px}.chip.active{background:var(--text);color:var(--bg)}.icon{width:36px;height:36px;border-radius:12px;background:color-mix(in srgb,var(--accent) 13%,var(--surface));display:grid;place-items:center}.thumb{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#b8c4b2,#806b56);flex:none}.thumb.wide{width:100%;height:116px}.divider{height:1px;background:var(--border)}.progress{height:7px;border-radius:99px;background:var(--border);overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:color-mix(in srgb,var(--border) 45%,transparent);padding:3px;border-radius:12px}.tabs button{height:34px;border:0;background:transparent;border-radius:9px;color:var(--muted)}.tabs .active{background:var(--surface);color:var(--text);box-shadow:0 1px 5px #0002}
.nav{position:absolute;bottom:0;left:0;right:0;height:72px;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);z-index:5}.nav button{border:0;background:transparent;color:var(--muted);font-size:10px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center}.nav .active{color:var(--accent);font-weight:700}.nav b{font-size:18px}
.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.avatar{width:42px;height:42px;border-radius:50%;background:#e6d7bf;border:1px solid var(--border);display:grid;place-items:center}.map{height:360px;border-radius:18px;background:linear-gradient(35deg,#e8e1d2,#cfdccf);position:relative;overflow:hidden}.route{position:absolute;left:20%;top:20%;width:60%;height:55%;border:4px solid var(--accent);border-color:var(--accent) transparent var(--accent) var(--accent);border-radius:50%;transform:rotate(-12deg)}.pin{position:absolute;width:30px;height:30px;border-radius:50% 50% 50% 0;background:var(--accent);color:white;display:grid;place-items:center;font-weight:700;transform:rotate(-45deg)}.pin span{transform:rotate(45deg)}.p1{left:18%;top:22%}.p2{left:48%;top:42%}.p3{left:72%;top:63%}
.timeline{position:relative;padding-left:28px}.timeline:before{content:"";position:absolute;left:10px;top:8px;bottom:8px;width:2px;background:var(--border)}.event{position:relative}.event:before{content:"";position:absolute;left:-24px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;padding:20px;box-shadow:0 -4px 24px #1E1A172E}.handle{width:44px;height:5px;border-radius:9px;background:var(--border);margin:0 auto 16px}.field{height:52px;border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:0 14px;color:var(--text);width:100%}.check{width:22px;height:22px;border:2px solid var(--border);border-radius:7px}.checked{background:var(--accent);border-color:var(--accent);color:#fff;display:grid;place-items:center}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:color-mix(in srgb,var(--green) 18%,var(--surface));color:var(--green);font-weight:700}
.themebar{position:fixed;right:12px;top:12px;z-index:50;background:#fff;border:1px solid #ccc;border-radius:999px;padding:4px;box-shadow:0 2px 12px #0002}.themebar button{border:0;background:transparent;padding:7px 9px;border-radius:999px;font-size:11px}
@media(max-width:430px){.phone{margin:0;width:100vw;min-height:100vh}.screen{min-height:100vh}.nav{position:fixed}}

.i{width:22px;height:22px;display:inline-block;vertical-align:middle}.i svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav .i{width:20px;height:20px}.icon .i{width:20px;height:20px}
.bea-slot{background:var(--surface);border:1px dashed var(--border);color:var(--muted)}</style></head><body><div class="themebar"><button data-theme-set="calm">Calm</button><button data-theme-set="colorful">Colorful</button><button data-theme-set="dark">Dark</button></div><div class="phone"><main class="screen stack">
<div style="height:42px"></div><div style="text-align:center"><div class="avatar bea-slot" style="width:104px;height:104px;margin:auto"><span class="i" data-icon-library="Lucide" data-icon-name="user-round"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span></div><h1 style="margin-top:18px">Welcome back</h1><div class="muted">Sign in to continue with Béa</div></div>
<button class="btn secondary">G&nbsp;&nbsp; Continue with Google</button><div class="row"><div class="divider" style="flex:1"></div><span class="small muted">or</span><div class="divider" style="flex:1"></div></div>
<label class="small"><b>Email</b><input class="field" type="email" placeholder="you@example.com"></label><label class="small"><b>Password</b><input class="field" type="password" placeholder="<span class="i" data-icon-library="Lucide" data-icon-name="ellipsis"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span><span class="i" data-icon-library="Lucide" data-icon-name="ellipsis"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span>••"></label>
<div class="card flat"><label class="row"><input type="radio" name="signin" checked> Sign me in automatically</label><label class="row"><input type="radio" name="signin"> Ask me every time</label></div>
<button class="btn primary">Sign in</button><button class="btn secondary">Forgot your password?</button><div class="small" style="text-align:center">New to Béa? <b>Create a new account</b></div><div class="small muted" style="text-align:center;margin-top:auto">Terms of Service · Privacy Policy<br>© Béa</div></main></div><script>document.querySelectorAll('[data-theme-set]').forEach(b=>b.addEventListener('click',()=>document.documentElement.dataset.theme=b.dataset.themeSet));document.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>b.classList.toggle('active')));</script></body></html>
